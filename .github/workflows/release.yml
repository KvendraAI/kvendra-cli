# Release binaries (ISSUE-KVD-CLI-97093A).
#
# Triggered by a `v*` tag. Builds the `kvendra` binary for five targets on native runners,
# packages each one with its sha256, and uploads everything to the GitHub Release of the tag
# (creating the release if the tag has none yet). It never publishes to crates.io: by owner
# decision `cargo publish` stays a step the owner runs in their own terminal.
#
# SPDX-License-Identifier: Apache-2.0

name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.9.1)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-13, target: x86_64-apple-darwin, archive: tar.gz }
          # Oldest supported Ubuntu runner, so the glibc requirement stays low.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi

      - name: Install system deps (Linux — pkg-config, libdbus for the keyring)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="kvendra-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/kvendra.exe" "dist/${name}/"
          else
            cp "target/${{ matrix.target }}/release/kvendra" "dist/${name}/"
          fi
          cp LICENSE README.md "dist/${name}/" 2>/dev/null || true
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "${name}.zip" "${name}" > /dev/null
            sha256sum "${name}.zip" > "${name}.zip.sha256"
          else
            tar -czf "${name}.tar.gz" "${name}"
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kvendra-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: upload to the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums file
        run: |
          cd dist
          cat *.sha256 | sort -k2 > "kvendra-${TAG}-checksums.txt"
          cat "kvendra-${TAG}-checksums.txt"

      - name: Create the release if missing, then upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${TAG}" > /dev/null 2>&1; then
            gh release create "${TAG}" --verify-tag --title "kvendra ${TAG#v}" --notes "Binaries for ${TAG}. Install: curl -fsSL https://raw.githubusercontent.com/KvendraAI/kvendra-cli/main/install.sh | sh"
          fi
          gh release upload "${TAG}" dist/*.tar.gz dist/*.zip dist/*.sha256 "dist/kvendra-${TAG}-checksums.txt" --clobber
